<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c16"/>
      <stop offset="50%" stop-color="#121511"/>
      <stop offset="100%" stop-color="#0a0c09"/>
    </linearGradient>

    <!-- Bubble Radial Gradients -->
    <radialGradient id="bubbleLime" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#e8ff8c"/>
      <stop offset="80%" stop-color="#d5ff55"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </radialGradient>

    <radialGradient id="bubbleCyan" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#bae6fd"/>
      <stop offset="80%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>

    <radialGradient id="bubbleCoral" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fed7aa"/>
      <stop offset="80%" stop-color="#ff784f"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>

    <radialGradient id="bubbleViolet" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#e9d5ff"/>
      <stop offset="80%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </radialGradient>

    <radialGradient id="bubbleGold" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="80%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="neonGlowBP" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="sparkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Background -->
  <rect width="640" height="380" fill="url(#bpBg)"/>

  <!-- Subtle Cyber Grid Dots -->
  <g fill="rgba(244, 242, 233, 0.04)">
    <circle cx="80" cy="60" r="1.5"/><circle cx="160" cy="60" r="1.5"/><circle cx="240" cy="60" r="1.5"/>
    <circle cx="320" cy="60" r="1.5"/><circle cx="400" cy="60" r="1.5"/><circle cx="480" cy="60" r="1.5"/><circle cx="560" cy="60" r="1.5"/>
    <circle cx="80" cy="140" r="1.5"/><circle cx="160" cy="140" r="1.5"/><circle cx="240" cy="140" r="1.5"/>
    <circle cx="320" cy="140" r="1.5"/><circle cx="400" cy="140" r="1.5"/><circle cx="480" cy="140" r="1.5"/><circle cx="560" cy="140" r="1.5"/>
    <circle cx="80" cy="220" r="1.5"/><circle cx="160" cy="220" r="1.5"/><circle cx="240" cy="220" r="1.5"/>
    <circle cx="320" cy="220" r="1.5"/><circle cx="400" cy="220" r="1.5"/><circle cx="480" cy="220" r="1.5"/><circle cx="560" cy="220" r="1.5"/>
    <circle cx="80" cy="300" r="1.5"/><circle cx="160" cy="300" r="1.5"/><circle cx="240" cy="300" r="1.5"/>
    <circle cx="320" cy="300" r="1.5"/><circle cx="400" cy="300" r="1.5"/><circle cx="480" cy="300" r="1.5"/><circle cx="560" cy="300" r="1.5"/>
  </g>

  <!-- Decorative Target Crosshairs -->
  <path d="M40 30 H60 M50 20 V40" stroke="rgba(213, 255, 85, 0.25)" stroke-width="1.5"/>
  <path d="M580 30 H600 M590 20 V40" stroke="rgba(213, 255, 85, 0.25)" stroke-width="1.5"/>
  <path d="M40 350 H60 M50 340 V360" stroke="rgba(213, 255, 85, 0.25)" stroke-width="1.5"/>
  <path d="M580 350 H600 M590 340 V360" stroke="rgba(213, 255, 85, 0.25)" stroke-width="1.5"/>

  <!-- 2. Popping Shockwave Rings -->
  <circle cx="320" cy="190" r="95" fill="none" stroke="rgba(213, 255, 85, 0.15)" stroke-width="2"/>
  <circle cx="320" cy="190" r="75" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2.5" stroke-dasharray="8 6"/>
  <circle cx="320" cy="190" r="55" fill="none" stroke="rgba(213, 255, 85, 0.6)" stroke-width="3" filter="url(#neonGlowBP)"/>

  <!-- 3. Burst Droplet Particles & Sparks -->
  <g filter="url(#sparkGlow)">
    <circle cx="260" cy="130" r="5" fill="#d5ff55"/>
    <circle cx="230" cy="170" r="4" fill="#38bdf8"/>
    <circle cx="250" cy="240" r="6" fill="#d5ff55"/>
    <circle cx="380" cy="120" r="5" fill="#ff784f"/>
    <circle cx="410" cy="175" r="4.5" fill="#d5ff55"/>
    <circle cx="395" cy="245" r="5.5" fill="#38bdf8"/>
    <circle cx="320" cy="95" r="6" fill="#a855f7"/>
    <circle cx="320" cy="285" r="5" fill="#fbbf24"/>
    <circle cx="280" cy="100" r="3.5" fill="#ffffff"/>
    <circle cx="360" cy="270" r="3.5" fill="#ffffff"/>
  </g>

  <!-- 4. Surrounding Bubble Clusters -->
  <!-- Lime Cluster (Bottom-Left) -->
  <g filter="url(#neonGlowBP)">
    <circle cx="150" cy="250" r="38" fill="url(#bubbleLime)"/>
    <circle cx="138" cy="238" r="10" fill="#ffffff" opacity="0.75"/>
    <text x="150" y="254" font-family="monospace" font-size="16" font-weight="bold" fill="#10120f" text-anchor="middle">◆</text>
  </g>

  <g filter="url(#neonGlowBP)">
    <circle cx="210" cy="275" r="34" fill="url(#bubbleLime)"/>
    <circle cx="200" cy="265" r="9" fill="#ffffff" opacity="0.75"/>
    <text x="210" y="279" font-family="monospace" font-size="14" font-weight="bold" fill="#10120f" text-anchor="middle">◆</text>
  </g>

  <!-- Cyan Cluster (Top-Left) -->
  <g filter="url(#neonGlowBP)">
    <circle cx="170" cy="130" r="36" fill="url(#bubbleCyan)"/>
    <circle cx="158" cy="118" r="9" fill="#ffffff" opacity="0.75"/>
    <text x="170" y="134" font-family="monospace" font-size="15" font-weight="bold" fill="#10120f" text-anchor="middle">●</text>
  </g>

  <g filter="url(#neonGlowBP)">
    <circle cx="230" cy="80" r="30" fill="url(#bubbleCyan)"/>
    <circle cx="220" cy="70" r="8" fill="#ffffff" opacity="0.75"/>
    <text x="230" y="84" font-family="monospace" font-size="13" font-weight="bold" fill="#10120f" text-anchor="middle">●</text>
  </g>

  <!-- Coral Cluster (Right) -->
  <g filter="url(#neonGlowBP)">
    <circle cx="470" cy="140" r="38" fill="url(#bubbleCoral)"/>
    <circle cx="458" cy="128" r="10" fill="#ffffff" opacity="0.75"/>
    <text x="470" y="144" font-family="monospace" font-size="16" font-weight="bold" fill="#10120f" text-anchor="middle">▲</text>
  </g>

  <g filter="url(#neonGlowBP)">
    <circle cx="510" cy="210" r="32" fill="url(#bubbleCoral)"/>
    <circle cx="500" cy="200" r="8.5" fill="#ffffff" opacity="0.75"/>
    <text x="510" y="214" font-family="monospace" font-size="14" font-weight="bold" fill="#10120f" text-anchor="middle">▲</text>
  </g>

  <!-- Violet & Gold Bubbles -->
  <g filter="url(#neonGlowBP)">
    <circle cx="450" cy="265" r="34" fill="url(#bubbleViolet)"/>
    <circle cx="440" cy="255" r="9" fill="#ffffff" opacity="0.75"/>
    <text x="450" y="269" font-family="monospace" font-size="15" font-weight="bold" fill="#10120f" text-anchor="middle">★</text>
  </g>

  <g filter="url(#neonGlowBP)">
    <circle cx="390" cy="70" r="28" fill="url(#bubbleGold)"/>
    <circle cx="382" cy="62" r="7" fill="#ffffff" opacity="0.75"/>
    <text x="390" y="74" font-family="monospace" font-size="12" font-weight="bold" fill="#10120f" text-anchor="middle">■</text>
  </g>

  <!-- 5. Center Hero Bursting Bubble -->
  <g filter="url(#neonGlowBP)">
    <!-- Expanding Halo -->
    <circle cx="320" cy="190" r="44" fill="none" stroke="#d5ff55" stroke-width="2.5" stroke-dasharray="6 4"/>
    <!-- Hero Bubble -->
    <circle cx="320" cy="190" r="40" fill="url(#bubbleLime)"/>
    <!-- Specular Crescent -->
    <circle cx="308" cy="178" r="11" fill="#ffffff" opacity="0.85"/>
    <!-- Center Emblem -->
    <text x="320" y="195" font-family="monospace" font-size="18" font-weight="bold" fill="#10120f" text-anchor="middle">◆</text>
  </g>

  <!-- Dynamic Score Combo Callout -->
  <g filter="url(#sparkGlow)">
    <rect x="260" y="20" width="120" height="28" rx="6" fill="#20241e" stroke="#d5ff55" stroke-width="1.5"/>
    <text x="320" y="38" font-family="monospace" font-size="12" font-weight="bold" fill="#d5ff55" text-anchor="middle">+490 (7×)</text>
  </g>
</svg>

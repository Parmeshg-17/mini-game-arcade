<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <defs>
    <filter id="glow-lime" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-gold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-rose" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10120f"/>
      <stop offset="100%" stop-color="#171a16"/>
    </linearGradient>
    <linearGradient id="rainbow-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d5ff55"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="270" fill="url(#bg-grad)"/>

  <!-- Subtle grid dots overlay -->
  <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1" fill="#20241e"/>
  </pattern>
  <rect width="480" height="270" fill="url(#dots)" opacity="0.5"/>

  <!-- 4x4 grid background (centred, slightly left) -->
  <rect x="44" y="35" width="222" height="200" rx="12" fill="#171a16" stroke="#20241e" stroke-width="1.5"/>

  <!-- Grid cells (4x4) with colours -->
  <!-- Row 0 -->
  <rect x="54" y="45" width="46" height="46" rx="6" fill="#20241e"/>
  <text x="77" y="76" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="15" fill="#4a4f46">2</text>

  <rect x="106" y="45" width="46" height="46" rx="6" fill="#d5ff55" filter="url(#glow-lime)"/>
  <text x="129" y="76" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="15" fill="#0b0d0a">8</text>

  <rect x="158" y="45" width="46" height="46" rx="6" fill="#38bdf8" filter="url(#glow-cyan)"/>
  <text x="181" y="76" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="15" fill="#0b0d0a">16</text>

  <rect x="210" y="45" width="46" height="46" rx="6" fill="#20241e"/>
  <text x="233" y="76" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="15" fill="#4a4f46">4</text>

  <!-- Row 1 -->
  <rect x="54" y="97" width="46" height="46" rx="6" fill="#ffd166" filter="url(#glow-gold)"/>
  <text x="77" y="128" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="15" fill="#0b0d0a">32</text>

  <rect x="106" y="97" width="46" height="46" rx="6" fill="#20241e"/>
  <text x="129" y="128" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="15" fill="#4a4f46">4</text>

  <rect x="158" y="97" width="46" height="46" rx="6" fill="#d5ff55" filter="url(#glow-lime)"/>
  <text x="181" y="128" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="15" fill="#0b0d0a">8</text>

  <rect x="210" y="97" width="46" height="46" rx="6" fill="#38bdf8" filter="url(#glow-cyan)"/>
  <text x="233" y="128" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="15" fill="#0b0d0a">16</text>

  <!-- Row 2 -->
  <rect x="54" y="149" width="46" height="46" rx="6" fill="#20241e"/>
  <text x="77" y="180" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="15" fill="#4a4f46">2</text>

  <rect x="106" y="149" width="46" height="46" rx="6" fill="#c084fc" filter="url(#glow-lime)"/>
  <text x="129" y="180" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="12" fill="#fff">128</text>

  <rect x="158" y="149" width="46" height="46" rx="6" fill="#ffd166" filter="url(#glow-gold)"/>
  <text x="181" y="180" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="15" fill="#0b0d0a">32</text>

  <rect x="210" y="149" width="46" height="46" rx="6" fill="#20241e"/>
  <text x="233" y="180" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="15" fill="#4a4f46">4</text>

  <!-- Row 3 -->
  <rect x="54" y="201" width="46" height="46" rx="6" fill="#ff784f" filter="url(#glow-rose)"/>
  <text x="77" y="232" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="15" fill="#fff">64</text>

  <rect x="106" y="201" width="46" height="46" rx="6" fill="#d5ff55" filter="url(#glow-lime)"/>
  <text x="129" y="232" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="15" fill="#0b0d0a">8</text>

  <!-- 2048 hero tile (large) -->
  <rect x="158" y="201" width="46" height="46" rx="6" fill="url(#rainbow-grad)" filter="url(#glow-cyan)"/>
  <text x="181" y="232" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="10" fill="#fff">2048</text>

  <rect x="210" y="201" width="46" height="46" rx="6" fill="#20241e"/>
  <text x="233" y="232" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="15" fill="#4a4f46">2</text>

  <!-- Right side: Score panel -->
  <rect x="286" y="35" width="160" height="90" rx="10" fill="#171a16" stroke="#20241e" stroke-width="1.5"/>
  <text x="366" y="65" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="11" fill="#6b7568" letter-spacing="2">SCORE</text>
  <text x="366" y="98" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="28" fill="#d5ff55" filter="url(#glow-lime)">3,840</text>

  <rect x="286" y="138" width="74" height="60" rx="8" fill="#171a16" stroke="#20241e" stroke-width="1.5"/>
  <text x="323" y="160" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="9" fill="#6b7568" letter-spacing="1">BEST</text>
  <text x="323" y="188" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="17" fill="#38bdf8" filter="url(#glow-cyan)">7,680</text>

  <rect x="372" y="138" width="74" height="60" rx="8" fill="#171a16" stroke="#20241e" stroke-width="1.5"/>
  <text x="409" y="160" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="9" fill="#6b7568" letter-spacing="1">MOVES</text>
  <text x="409" y="188" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="17" fill="#ffd166" filter="url(#glow-gold)">142</text>

  <!-- Arrow keys hint -->
  <rect x="286" y="212" width="160" height="52" rx="8" fill="#171a16" stroke="#20241e" stroke-width="1.5"/>
  <!-- Up arrow -->
  <text x="366" y="230" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4a4f46">▲</text>
  <!-- Left/Right/Down -->
  <text x="340" y="253" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4a4f46">◀</text>
  <text x="366" y="253" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4a4f46">▼</text>
  <text x="392" y="253" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4a4f46">▶</text>

  <!-- Title badge top right -->
  <rect x="286" y="0" width="194" height="28" rx="0" fill="#0b0d0a"/>
  <text x="366" y="19" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-weight="800" font-size="11" fill="#d5ff55" letter-spacing="2">MERGE GRID</text>

  <!-- Merge arrow animation hint -->
  <text x="260" y="175" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#d5ff55" filter="url(#glow-lime)" opacity="0.7">→</text>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c16"/>
      <stop offset="50%" stop-color="#121511"/>
      <stop offset="100%" stop-color="#0c0e0b"/>
    </linearGradient>

    <!-- Electric Lime Blade Slash -->
    <linearGradient id="limeBlade" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d5ff55" stop-opacity="0.1"/>
      <stop offset="40%" stop-color="#d5ff55"/>
      <stop offset="65%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ff784f"/>
    </linearGradient>

    <!-- Watermelon Gradient -->
    <radialGradient id="melonFlesh" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="70%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </radialGradient>

    <!-- Orange Gradient -->
    <radialGradient id="orangeFlesh" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff9a76"/>
      <stop offset="75%" stop-color="#ff784f"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="bladeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="640" height="380" rx="16" fill="url(#cardBg)"/>

  <!-- Subtle Subtle Grid Lines -->
  <g opacity="0.06" stroke="#f4f2e9" stroke-width="1">
    <line x1="0" y1="95" x2="640" y2="95"/>
    <line x1="0" y1="190" x2="640" y2="190"/>
    <line x1="0" y1="285" x2="640" y2="285"/>
    <line x1="160" y1="0" x2="160" y2="380"/>
    <line x1="320" y1="0" x2="320" y2="380"/>
    <line x1="480" y1="0" x2="480" y2="380"/>
  </g>

  <!-- Registration Marks in Corners -->
  <g stroke="#d5ff55" stroke-width="1.5" opacity="0.4">
    <!-- Top-Left -->
    <line x1="24" y1="18" x2="24" y2="30"/>
    <line x1="18" y1="24" x2="30" y2="24"/>
    <!-- Top-Right -->
    <line x1="616" y1="18" x2="616" y2="30"/>
    <line x1="610" y1="24" x2="622" y2="24"/>
    <!-- Bottom-Left -->
    <line x1="24" y1="350" x2="24" y2="362"/>
    <line x1="18" y1="356" x2="30" y2="356"/>
    <!-- Bottom-Right -->
    <line x1="616" y1="350" x2="616" y2="362"/>
    <line x1="610" y1="356" x2="622" y2="356"/>
  </g>

  <!-- Ambient Light Halos -->
  <circle cx="320" cy="190" r="140" fill="#d5ff55" opacity="0.07" filter="url(#bladeGlow)"/>
  <circle cx="230" cy="160" r="110" fill="#e11d48" opacity="0.09" filter="url(#bladeGlow)"/>

  <!-- Juice Droplets -->
  <g fill="#e11d48" opacity="0.7">
    <circle cx="170" cy="130" r="9"/>
    <circle cx="145" cy="105" r="5"/>
    <circle cx="205" cy="85" r="7"/>
    <circle cx="395" cy="75" r="11"/>
    <circle cx="450" cy="105" r="6"/>
    <circle cx="485" cy="145" r="8"/>
  </g>
  <g fill="#ff784f" opacity="0.7">
    <circle cx="440" cy="245" r="10"/>
    <circle cx="495" cy="225" r="7"/>
    <circle cx="475" cy="275" r="4.5"/>
    <circle cx="155" cy="235" r="8"/>
  </g>

  <!-- Flying Citrus Orange Wedge (Top Right) -->
  <g transform="translate(420, 115) rotate(28)">
    <path d="M -54 0 A 54 54 0 0 0 54 0 Z" fill="#c2410c"/>
    <path d="M -50 0 A 50 50 0 0 0 50 0 Z" fill="#ffedd5"/>
    <path d="M -45 0 A 45 45 0 0 0 45 0 Z" fill="url(#orangeFlesh)"/>
    <!-- Pulp Segments -->
    <path d="M 0 0 L -36 -16 A 40 40 0 0 0 -13 -38 Z" fill="#ff9a76" opacity="0.95"/>
    <path d="M 0 0 L -9 -39 A 40 40 0 0 0 20 -35 Z" fill="#ff9a76" opacity="0.95"/>
    <path d="M 0 0 L 24 -33 A 40 40 0 0 0 38 -13 Z" fill="#ff9a76" opacity="0.95"/>
  </g>

  <!-- Watermelon Bottom Half Sliced in Mid-Air -->
  <g transform="translate(265, 235) rotate(-16)">
    <path d="M -86 0 A 86 86 0 0 0 86 0 Z" fill="#15803d"/>
    <path d="M -80 0 A 80 80 0 0 0 80 0 Z" fill="#f0fdf4"/>
    <path d="M -73 0 A 73 73 0 0 0 73 0 Z" fill="url(#melonFlesh)"/>
    <!-- Black Teardrop Seeds -->
    <ellipse cx="-44" cy="26" rx="5" ry="3" fill="#171a16" transform="rotate(30 -44 26)"/>
    <ellipse cx="-16" cy="42" rx="5" ry="3" fill="#171a16" transform="rotate(10 -16 42)"/>
    <ellipse cx="16" cy="42" rx="5" ry="3" fill="#171a16" transform="rotate(-10 16 42)"/>
    <ellipse cx="44" cy="26" rx="5" ry="3" fill="#171a16" transform="rotate(-30 44 26)"/>
    <!-- Sheen on cut -->
    <line x1="-70" y1="0" x2="70" y2="0" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  </g>

  <!-- Watermelon Top Half (Flying Upward Separated by Blade) -->
  <g transform="translate(225, 140) rotate(16)">
    <path d="M -86 0 A 86 86 0 0 1 86 0 Z" fill="#15803d"/>
    <path d="M -80 0 A 80 80 0 0 1 80 0 Z" fill="#f0fdf4"/>
    <path d="M -73 0 A 73 73 0 0 1 73 0 Z" fill="url(#melonFlesh)"/>
    <ellipse cx="-38" cy="-26" rx="5" ry="3" fill="#171a16" transform="rotate(-20 -38 -26)"/>
    <ellipse cx="0" cy="-38" rx="5" ry="3" fill="#171a16"/>
    <ellipse cx="38" cy="-26" rx="5" ry="3" fill="#171a16" transform="rotate(20 38 -26)"/>
    <line x1="-70" y1="0" x2="70" y2="0" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  </g>

  <!-- Golden Bonus Starfruit (Top Left) -->
  <g transform="translate(135, 95)" filter="url(#bladeGlow)">
    <polygon points="0,-28 8,-9 28,-9 12,3 18,22 0,10 -18,22 -12,3 -28,-9 -8,-9" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
  </g>

  <!-- Electric Lime Blade Slash Curve Cutting Through Fruits -->
  <path d="M 45 325 Q 240 180 575 55" fill="none" stroke="url(#limeBlade)" stroke-width="9" stroke-linecap="round" filter="url(#bladeGlow)"/>
  <path d="M 45 325 Q 240 180 575 55" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Blade Trail Sparks -->
  <g fill="#d5ff55" filter="url(#bladeGlow)">
    <circle cx="245" cy="182" r="4.5"/>
    <circle cx="285" cy="162" r="3.5"/>
    <circle cx="330" cy="142" r="5.5"/>
    <circle cx="365" cy="128" r="3"/>
  </g>

  <!-- Editorial Metadata Label -->
  <g transform="translate(38, 38)">
    <rect width="130" height="28" rx="6" fill="#10120f" stroke="#d5ff55" stroke-width="1.2"/>
    <circle cx="14" cy="14" r="3.5" fill="#d5ff55"/>
    <text x="70" y="18" fill="#f4f2e9" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">ARCADE // 01</text>
  </g>
</svg>

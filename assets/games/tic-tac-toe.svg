<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="tttBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c16"/>
      <stop offset="50%" stop-color="#121511"/>
      <stop offset="100%" stop-color="#0c0e0b"/>
    </linearGradient>

    <!-- Electric Lime Gradient for X -->
    <linearGradient id="limeX" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8ff8c"/>
      <stop offset="50%" stop-color="#d5ff55"/>
      <stop offset="100%" stop-color="#9bcc22"/>
    </linearGradient>

    <!-- Coral Red Gradient for O -->
    <radialGradient id="coralO" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff9a76"/>
      <stop offset="60%" stop-color="#ff784f"/>
      <stop offset="100%" stop-color="#e0481d"/>
    </radialGradient>

    <!-- Winning Strike Beam Gradient -->
    <linearGradient id="strikeBeam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#d5ff55"/>
      <stop offset="100%" stop-color="#d5ff55" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow Filter for Strikes and Neon Marks -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="640" height="380" rx="16" fill="url(#tttBg)"/>

  <!-- Subtle Subtle Grid Lines -->
  <g opacity="0.06" stroke="#f4f2e9" stroke-width="1">
    <line x1="0" y1="95" x2="640" y2="95"/>
    <line x1="0" y1="190" x2="640" y2="190"/>
    <line x1="0" y1="285" x2="640" y2="285"/>
    <line x1="160" y1="0" x2="160" y2="380"/>
    <line x1="320" y1="0" x2="320" y2="380"/>
    <line x1="480" y1="0" x2="480" y2="380"/>
  </g>

  <!-- Decorative Corner Crosshairs -->
  <g stroke="#d5ff55" stroke-width="1.5" opacity="0.4">
    <path d="M 28 20 L 28 36 M 20 28 L 36 28"/>
    <path d="M 612 20 L 612 36 M 604 28 L 620 28"/>
    <path d="M 28 344 L 28 360 M 20 352 L 36 352"/>
    <path d="M 612 344 L 612 360 M 604 352 L 620 352"/>
  </g>

  <!-- Central Game Board Frame -->
  <g transform="translate(195, 65)">
    <!-- Grid Outer Subtle Glow Box -->
    <rect x="-10" y="-10" width="270" height="270" rx="16" fill="#171a16" stroke="rgba(244,242,233,0.1)" stroke-width="1.5"/>

    <!-- 3x3 Grid Lines with Neon Accent -->
    <g stroke="rgba(244,242,233,0.18)" stroke-width="3" stroke-linecap="round">
      <!-- Vertical Lines -->
      <line x1="83" y1="10" x2="83" y2="240"/>
      <line x1="167" y1="10" x2="167" y2="240"/>
      <!-- Horizontal Lines -->
      <line x1="10" y1="83" x2="240" y2="83"/>
      <line x1="10" y1="167" x2="240" y2="167"/>
    </g>

    <!-- Grid Marks Placed -->
    <!-- Cell 0,0: X (Winning Mark 1) -->
    <g transform="translate(42, 42)" filter="url(#neonGlow)">
      <circle cx="0" cy="0" r="32" fill="#d5ff55" fill-opacity="0.08"/>
      <line x1="-18" y1="-18" x2="18" y2="18" stroke="url(#limeX)" stroke-width="6" stroke-linecap="round"/>
      <line x1="18" y1="-18" x2="-18" y2="18" stroke="url(#limeX)" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- Cell 0,1: O -->
    <g transform="translate(125, 42)" filter="url(#softGlow)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="url(#coralO)" stroke-width="5"/>
    </g>

    <!-- Cell 0,2: Empty -->

    <!-- Cell 1,0: O -->
    <g transform="translate(42, 125)" filter="url(#softGlow)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="url(#coralO)" stroke-width="5"/>
    </g>

    <!-- Cell 1,1: X (Winning Mark 2 - Center) -->
    <g transform="translate(125, 125)" filter="url(#neonGlow)">
      <circle cx="0" cy="0" r="32" fill="#d5ff55" fill-opacity="0.08"/>
      <line x1="-18" y1="-18" x2="18" y2="18" stroke="url(#limeX)" stroke-width="6" stroke-linecap="round"/>
      <line x1="18" y1="-18" x2="-18" y2="18" stroke="url(#limeX)" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- Cell 1,2: O -->
    <g transform="translate(208, 125)" filter="url(#softGlow)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="url(#coralO)" stroke-width="5"/>
    </g>

    <!-- Cell 2,0: Empty -->

    <!-- Cell 2,1: Empty -->

    <!-- Cell 2,2: X (Winning Mark 3) -->
    <g transform="translate(208, 208)" filter="url(#neonGlow)">
      <circle cx="0" cy="0" r="32" fill="#d5ff55" fill-opacity="0.08"/>
      <line x1="-18" y1="-18" x2="18" y2="18" stroke="url(#limeX)" stroke-width="6" stroke-linecap="round"/>
      <line x1="18" y1="-18" x2="-18" y2="18" stroke="url(#limeX)" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- Neon Winning Strike Line (Diagonal 0,0 to 2,2) -->
    <!-- Glow Underlay -->
    <line x1="20" y1="20" x2="230" y2="230" stroke="#d5ff55" stroke-width="12" stroke-linecap="round" opacity="0.35" filter="url(#neonGlow)"/>
    <!-- Core Bright Laser -->
    <line x1="20" y1="20" x2="230" y2="230" stroke="url(#strikeBeam)" stroke-width="5" stroke-linecap="round"/>
    <!-- Spark Particles along Strike Line -->
    <circle cx="42" cy="42" r="3" fill="#ffffff" filter="url(#softGlow)"/>
    <circle cx="125" cy="125" r="4" fill="#ffffff" filter="url(#softGlow)"/>
    <circle cx="208" cy="208" r="3" fill="#ffffff" filter="url(#softGlow)"/>
  </g>

  <!-- Left Accent Badge -->
  <g transform="translate(48, 160)">
    <rect width="112" height="34" rx="6" fill="#171a16" stroke="rgba(213,255,85,0.3)" stroke-width="1"/>
    <circle cx="16" cy="17" r="4" fill="#d5ff55"/>
    <text x="28" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#f4f2e9" letter-spacing="1">VS BOT // AI</text>
  </g>

  <!-- Right Accent Badge -->
  <g transform="translate(480, 160)">
    <rect width="112" height="34" rx="6" fill="#171a16" stroke="rgba(255,120,79,0.3)" stroke-width="1"/>
    <circle cx="16" cy="17" r="4" fill="#ff784f"/>
    <text x="28" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#f4f2e9" letter-spacing="1">2 PLAYERS</text>
  </g>

  <!-- Floating Spark Dots -->
  <circle cx="150" cy="90" r="1.5" fill="#d5ff55" opacity="0.6"/>
  <circle cx="480" cy="100" r="2" fill="#ff784f" opacity="0.7"/>
  <circle cx="140" cy="290" r="2" fill="#38bdf8" opacity="0.5"/>
  <circle cx="500" cy="280" r="1.5" fill="#d5ff55" opacity="0.6"/>
</svg>
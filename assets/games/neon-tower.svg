<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Neon Tower Cyber Stacker Game Thumbnail">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="nt-bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="60%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#04060a"/>
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="nt-glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="nt-glow-pink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="nt-glow-lime" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Slab Gradients -->
    <linearGradient id="slab-cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6f8ff"/>
      <stop offset="25%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#00585f"/>
    </linearGradient>

    <linearGradient id="slab-pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff99cc"/>
      <stop offset="25%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#660033"/>
    </linearGradient>

    <linearGradient id="slab-lime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8ff96"/>
      <stop offset="25%" stop-color="#39ff14"/>
      <stop offset="100%" stop-color="#145c05"/>
    </linearGradient>

    <linearGradient id="slab-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#deb6ff"/>
      <stop offset="25%" stop-color="#b026ff"/>
      <stop offset="100%" stop-color="#480573"/>
    </linearGradient>

    <linearGradient id="slab-amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff48a"/>
      <stop offset="25%" stop-color="#ffe600"/>
      <stop offset="100%" stop-color="#665c00"/>
    </linearGradient>
  </defs>

  <!-- Deep Stage Background -->
  <rect width="480" height="270" fill="url(#nt-bg)"/>

  <!-- Distant Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="45" cy="38" r="1.2"/>
    <circle cx="85" cy="85" r="1.5" opacity="0.4"/>
    <circle cx="140" cy="24" r="1"/>
    <circle cx="390" cy="42" r="1.4"/>
    <circle cx="435" cy="90" r="1"/>
    <circle cx="410" cy="160" r="1.2" opacity="0.5"/>
    <circle cx="65" cy="180" r="1.3" opacity="0.4"/>
  </g>

  <!-- Perspective Horizon & Ground Grid -->
  <g opacity="0.22" stroke="#00f0ff" stroke-width="1">
    <line x1="0" y1="230" x2="480" y2="230"/>
    <line x1="0" y1="242" x2="480" y2="242"/>
    <line x1="0" y1="256" x2="480" y2="256"/>
    <!-- Vanishing Lines -->
    <line x1="240" y1="220" x2="60" y2="270"/>
    <line x1="240" y1="220" x2="150" y2="270"/>
    <line x1="240" y1="220" x2="240" y2="270"/>
    <line x1="240" y1="220" x2="330" y2="270"/>
    <line x1="240" y1="220" x2="420" y2="270"/>
  </g>

  <!-- Base Pedestal Platform -->
  <rect x="140" y="222" width="200" height="18" rx="3" fill="#0c121d" stroke="#00f0ff" stroke-width="2" filter="url(#nt-glow-cyan)"/>
  <line x1="145" y1="225" x2="335" y2="225" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>

  <!-- Tower Blocks Stack -->
  <!-- Floor 1: Cyan -->
  <rect x="155" y="202" width="170" height="18" rx="3" fill="url(#slab-cyan)" stroke="#00f0ff" stroke-width="1.5" filter="url(#nt-glow-cyan)"/>
  <line x1="160" y1="204" x2="320" y2="204" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>

  <!-- Floor 2: Magenta -->
  <rect x="162" y="182" width="156" height="18" rx="3" fill="url(#slab-pink)" stroke="#ff007f" stroke-width="1.5" filter="url(#nt-glow-pink)"/>
  <line x1="166" y1="184" x2="314" y2="184" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>

  <!-- Floor 3: Lime -->
  <rect x="162" y="162" width="156" height="18" rx="3" fill="url(#slab-lime)" stroke="#39ff14" stroke-width="1.5" filter="url(#nt-glow-lime)"/>
  <line x1="166" y1="164" x2="314" y2="164" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>

  <!-- Floor 4: Purple -->
  <rect x="170" y="142" width="140" height="18" rx="3" fill="url(#slab-purple)" stroke="#b026ff" stroke-width="1.5"/>
  <line x1="174" y1="144" x2="306" y2="144" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>

  <!-- Floor 5: Amber (Active Drop) -->
  <rect x="182" y="122" width="128" height="18" rx="3" fill="url(#slab-amber)" stroke="#ffe600" stroke-width="2" filter="url(#nt-glow-cyan)"/>
  <line x1="186" y1="124" x2="306" y2="124" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>

  <!-- Falling Trimmed Debris Piece -->
  <g transform="translate(314, 134) rotate(18)">
    <rect x="0" y="0" width="22" height="18" rx="2" fill="url(#slab-amber)" stroke="#ffe600" stroke-width="1.5" opacity="0.75"/>
  </g>

  <!-- Spark Bursts & Slice Laser Line -->
  <line x1="310" y1="114" x2="310" y2="148" stroke="#ffffff" stroke-width="2" filter="url(#nt-glow-cyan)"/>
  <circle cx="310" cy="122" r="3.5" fill="#ffffff" filter="url(#nt-glow-cyan)"/>
  <circle cx="316" cy="118" r="2" fill="#ffe600"/>
  <circle cx="322" cy="126" r="1.5" fill="#ff007f"/>
  <circle cx="314" cy="132" r="2" fill="#00f0ff"/>
  <circle cx="320" cy="138" r="1.2" fill="#ffffff"/>

  <!-- Glowing Badge: PERFECT COMBO x5 -->
  <g transform="translate(240, 78)">
    <rect x="-74" y="-14" width="148" height="28" rx="14" fill="#0e1422" stroke="#00f0ff" stroke-width="1.5" filter="url(#nt-glow-cyan)"/>
    <text x="0" y="5" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="12" font-weight="800" fill="#00f0ff" text-anchor="middle" letter-spacing="1">PERFECT x5</text>
  </g>

  <!-- Top Title / Header Branding -->
  <g transform="translate(240, 36)">
    <text x="0" y="0" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">NEON TOWER</text>
  </g>
</svg>


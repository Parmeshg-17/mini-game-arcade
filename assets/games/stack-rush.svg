<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Stack Rush 3D Slicing Stacker Arcade Thumbnail">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="srBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="55%" stop-color="#0c0e15"/>
      <stop offset="100%" stop-color="#06070a"/>
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="srGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="srSparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Stage Background -->
  <rect width="640" height="360" fill="url(#srBg)"/>

  <!-- Isometric Blueprint Grid on Floor -->
  <g opacity="0.18" stroke="#38bdf8" stroke-width="1.2">
    <!-- Grid lines along X -->
    <line x1="80" y1="280" x2="320" y2="350"/>
    <line x1="140" y1="245" x2="380" y2="315"/>
    <line x1="200" y1="210" x2="440" y2="280"/>
    <line x1="260" y1="175" x2="500" y2="245"/>
    <line x1="320" y1="140" x2="560" y2="210"/>

    <!-- Grid lines along Z -->
    <line x1="560" y1="210" x2="320" y2="350"/>
    <line x1="500" y1="175" x2="260" y2="315"/>
    <line x1="440" y1="140" x2="200" y2="280"/>
    <line x1="380" y1="105" x2="140" y2="245"/>
    <line x1="320" y1="70" x2="80" y2="210"/>
  </g>

  <!-- Ground Pedestal (Isometric base slab) -->
  <g transform="translate(320, 290)">
    <!-- Bottom slab outline -->
    <polygon points="0,-18 100,38 0,94 -100,38" fill="rgba(30, 41, 59, 0.6)" stroke="#38bdf8" stroke-width="1.8" filter="url(#srGlow)" opacity="0.65"/>
  </g>

  <!-- The 3D Stacking Tower (Blocks stacked vertically, shaded isometric faces) -->
  <!-- Layer 0: Dark Indigo / Base (y = 290) -->
  <g transform="translate(320, 275)">
    <!-- Left face -->
    <polygon points="-80,0 0,44 0,58 -80,14" fill="#2e1065"/>
    <!-- Right face -->
    <polygon points="0,44 80,0 80,14 0,58" fill="#431407" opacity="0.3"/>
    <polygon points="0,44 80,0 80,14 0,58" fill="#3b0764"/>
    <!-- Top face -->
    <polygon points="0,-44 80,0 0,44 -80,0" fill="#581c87" stroke="#7e22ce" stroke-width="1"/>
  </g>

  <!-- Layer 1: Deep Teal (y = 260) -->
  <g transform="translate(320, 258)">
    <polygon points="-80,0 0,44 0,58 -80,14" fill="#0f766e"/>
    <polygon points="0,44 80,0 80,14 0,58" fill="#115e59"/>
    <polygon points="0,-44 80,0 0,44 -80,0" fill="#14b8a6" stroke="#2dd4bf" stroke-width="1"/>
  </g>

  <!-- Layer 2: Vibrant Purple / Violet (y = 241) -->
  <g transform="translate(318, 241)">
    <polygon points="-78,0 0,43 0,57 -78,14" fill="#6b21a8"/>
    <polygon points="0,43 78,0 78,14 0,57" fill="#7e22ce"/>
    <polygon points="0,-43 78,0 0,43 -78,0" fill="#a855f7" stroke="#c084fc" stroke-width="1"/>
  </g>

  <!-- Layer 3: Crimson Red (y = 224) -->
  <g transform="translate(315, 224)">
    <polygon points="-74,0 0,41 0,55 -74,14" fill="#991b1b"/>
    <polygon points="0,41 74,0 74,14 0,55" fill="#b91c1c"/>
    <polygon points="0,-41 74,0 0,41 -74,0" fill="#ef4444" stroke="#f87171" stroke-width="1"/>
  </g>

  <!-- Layer 4: Vivid Blue (y = 207) -->
  <g transform="translate(315, 207)">
    <polygon points="-70,0 0,39 0,53 -70,14" fill="#1d4ed8"/>
    <polygon points="0,39 70,0 70,14 0,53" fill="#2563eb"/>
    <polygon points="0,-39 70,0 0,39 -70,0" fill="#3b82f6" stroke="#60a5fa" stroke-width="1"/>
  </g>

  <!-- Layer 5: Bright Cyan (y = 190) -->
  <g transform="translate(312, 190)">
    <polygon points="-66,0 0,37 0,51 -66,14" fill="#0284c7"/>
    <polygon points="0,37 66,0 66,14 0,51" fill="#0369a1"/>
    <polygon points="0,-37 66,0 0,37 -66,0" fill="#38bdf8" stroke="#7dd3fc" stroke-width="1"/>
  </g>

  <!-- Layer 6: Deep Pink / Magenta (y = 173) -->
  <g transform="translate(316, 173)">
    <polygon points="-60,0 0,33 0,47 -60,14" fill="#be185d"/>
    <polygon points="0,33 60,0 60,14 0,47" fill="#9d174d"/>
    <polygon points="0,-33 60,0 0,33 -60,0" fill="#ec4899" stroke="#f472b6" stroke-width="1"/>
  </g>

  <!-- Layer 7: Vibrant Orange (y = 156) -->
  <g transform="translate(314, 156)">
    <polygon points="-56,0 0,31 0,45 -56,14" fill="#c2410c"/>
    <polygon points="0,31 56,0 56,14 0,45" fill="#9a3412"/>
    <polygon points="0,-31 56,0 0,31 -56,0" fill="#f97316" stroke="#fb923c" stroke-width="1"/>
  </g>

  <!-- Layer 8: Emerald / Mint (y = 139) -->
  <g transform="translate(318, 139)">
    <polygon points="-52,0 0,29 0,43 -52,14" fill="#047857"/>
    <polygon points="0,29 52,0 52,14 0,43" fill="#065f46"/>
    <polygon points="0,-29 52,0 0,29 -52,0" fill="#10b981" stroke="#34d399" stroke-width="1"/>
  </g>

  <!-- Layer 9: Electric Purple (y = 122) -->
  <g transform="translate(315, 122)">
    <polygon points="-48,0 0,27 0,41 -48,14" fill="#581c87"/>
    <polygon points="0,27 48,0 48,14 0,41" fill="#6b21a8"/>
    <polygon points="0,-27 48,0 0,27 -48,0" fill="#9333ea" stroke="#a855f7" stroke-width="1"/>
  </g>

  <!-- Layer 10: Neon Orange / Warm Amber (y = 105) -->
  <g transform="translate(316, 105)">
    <polygon points="-44,0 0,25 0,39 -44,14" fill="#c2410c"/>
    <polygon points="0,25 44,0 44,14 0,39" fill="#ea580c"/>
    <polygon points="0,-25 44,0 0,25 -44,0" fill="#f97316" stroke="#fdba74" stroke-width="1.2"/>
  </g>

  <!-- Sliced Falling Debris Piece (tumbles off to the right with motion streaks) -->
  <g transform="translate(385, 128) rotate(16)">
    <polygon points="-14,0 0,8 0,18 -14,10" fill="#9a3412" opacity="0.8"/>
    <polygon points="0,8 14,0 14,10 0,18" fill="#c2410c" opacity="0.8"/>
    <polygon points="0,-8 14,0 0,8 -14,0" fill="#ea580c" opacity="0.85" stroke="#fdba74" stroke-width="0.8"/>
    <!-- Motion trails -->
    <line x1="12" y1="-5" x2="28" y2="-18" stroke="#f97316" stroke-width="1.2" opacity="0.6" stroke-dasharray="2 3"/>
    <line x1="0" y1="18" x2="10" y2="35" stroke="#f97316" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Active Gliding / Dropping Top Block (Glowing Cyan Block) -->
  <g transform="translate(316, 68)">
    <!-- Shadow projection below -->
    <polygon points="0,-24 44,0 0,24 -44,0" fill="rgba(56, 189, 248, 0.15)" transform="translate(0, 32) scale(0.9)"/>
    <!-- 3D moving block -->
    <polygon points="-44,0 0,25 0,42 -44,17" fill="#0284c7"/>
    <polygon points="0,25 44,0 44,17 0,42" fill="#0369a1"/>
    <polygon points="0,-25 44,0 0,25 -44,0" fill="#38bdf8" stroke="#ffffff" stroke-width="1.8" filter="url(#srGlow)"/>
  </g>

  <!-- Luminous Fountain of Sparkle Particles Bursting Upwards (as in screenshot) -->
  <g transform="translate(316, 50)" filter="url(#srSparkleGlow)">
    <circle cx="-12" cy="-15" r="2.5" fill="#ffffff"/>
    <circle cx="8" cy="-22" r="3" fill="#38bdf8"/>
    <circle cx="-4" cy="-38" r="2" fill="#7dd3fc"/>
    <circle cx="16" cy="-14" r="2.2" fill="#ffffff"/>
    <circle cx="-18" cy="-28" r="1.8" fill="#38bdf8"/>
    <circle cx="0" cy="-48" r="2.8" fill="#ffffff"/>
    <circle cx="12" cy="-36" r="2" fill="#7dd3fc"/>
    <circle cx="-8" cy="-55" r="1.5" fill="#38bdf8"/>
    <circle cx="4" cy="-62" r="2.2" fill="#ffffff"/>
    <circle cx="-14" cy="-42" r="1.6" fill="#38bdf8"/>
    <circle cx="20" cy="-26" r="1.4" fill="#7dd3fc"/>
  </g>

  <!-- Floating "+1 PERFECT!" Chime Feedback -->
  <g transform="translate(316, 18)">
    <rect x="-65" y="-14" width="130" height="26" rx="13" fill="rgba(16, 185, 129, 0.25)" stroke="#10b981" stroke-width="1.2"/>
    <text x="0" y="4" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="12" font-weight="800" fill="#d5ff55" text-anchor="middle" letter-spacing="1">★ PERFECT! x4</text>
  </g>

  <!-- Top Badges & Arcade Branding -->
  <g transform="translate(24, 28)">
    <rect x="0" y="0" width="168" height="26" rx="6" fill="#171a16" stroke="#2d3329" stroke-width="1"/>
    <text x="10" y="17" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#38bdf8" letter-spacing="0.5">3D STACKER // ARCADE</text>
  </g>

  <g transform="translate(500, 28)">
    <rect x="0" y="0" width="116" height="26" rx="6" fill="#171a16" stroke="rgba(213, 255, 85, 0.4)" stroke-width="1"/>
    <text x="58" y="17" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#d5ff55" text-anchor="middle" letter-spacing="0.5">ONE-BUTTON</text>
  </g>

  <!-- Bottom Title Banner -->
  <g transform="translate(24, 334)">
    <text font-family="'Space Grotesk', -apple-system, sans-serif" font-size="20" font-weight="800" fill="#f3f4f6" letter-spacing="-0.5">
      STACK RUSH <tspan fill="#38bdf8">//</tspan> <tspan font-size="13" font-family="'JetBrains Mono', monospace" font-weight="500" fill="#9ca3af">Precision Tower Stacking</tspan>
    </text>
  </g>
</svg>

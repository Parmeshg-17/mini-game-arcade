<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <defs>
    <filter id="hh-glow-lime" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="hh-glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="hh-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141813" />
      <stop offset="50%" stop-color="#0f120e" />
      <stop offset="100%" stop-color="#191c16" />
    </linearGradient>
    <linearGradient id="hh-lens-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#d5ff55" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#2a3f2d" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="hh-gold-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe885" />
      <stop offset="50%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#b8860b" />
    </linearGradient>
    <linearGradient id="hh-book-cover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d2b1f" />
      <stop offset="100%" stop-color="#241912" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="480" height="270" fill="url(#hh-bg-grad)" />

  <!-- Atmospheric Background Map Contour Lines -->
  <g opacity="0.15" stroke="#d5ff55" stroke-width="1" fill="none">
    <ellipse cx="240" cy="135" rx="200" ry="110" />
    <ellipse cx="240" cy="135" rx="160" ry="85" />
    <ellipse cx="240" cy="135" rx="120" ry="60" stroke-dasharray="4,4" />
    <path d="M 40,70 Q 140,20 240,70 T 440,70" />
    <path d="M 30,200 Q 150,250 240,200 T 450,200" />
  </g>

  <!-- Old Library Books on Left -->
  <g transform="translate(60, 60)">
    <!-- Book 1 (stacked) -->
    <rect x="0" y="90" width="130" height="26" rx="3" fill="#2e1f27" stroke="#4a323f" stroke-width="1.5" />
    <line x1="15" y1="94" x2="15" y2="112" stroke="#ffd166" stroke-width="1.5" />
    <line x1="20" y1="94" x2="20" y2="112" stroke="#ffd166" stroke-width="1" />
    
    <!-- Book 2 (tilted) -->
    <g transform="rotate(-6 10 70)">
      <rect x="5" y="65" width="120" height="24" rx="3" fill="url(#hh-book-cover)" stroke="#5a3d2e" stroke-width="1.5" />
      <line x1="20" y1="70" x2="20" y2="85" stroke="#d5ff55" stroke-width="1.5" />
      <text x="55" y="81" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#d5ff55" letter-spacing="1">ARCHIVE</text>
    </g>

    <!-- Scroll Roll -->
    <rect x="15" y="42" width="90" height="18" rx="7" fill="#f4f2e9" stroke="#c4beaa" stroke-width="1.5" opacity="0.9" />
    <line x1="30" y1="51" x2="85" y2="51" stroke="#9fa896" stroke-width="1" stroke-dasharray="3,2" />
  </g>

  <!-- Pirate Treasure Elements on Right -->
  <g transform="translate(320, 75)">
    <!-- Antique Brass Nautical Compass -->
    <circle cx="50" cy="80" r="38" fill="#1b2018" stroke="url(#hh-gold-metal)" stroke-width="3" />
    <circle cx="50" cy="80" r="32" fill="#141812" stroke="#4a5245" stroke-width="1" />
    <!-- Compass Rose -->
    <polygon points="50,54 53,78 50,80 47,78" fill="#d5ff55" />
    <polygon points="50,106 53,82 50,80 47,82" fill="#9fa896" />
    <polygon points="24,80 48,77 50,80 48,83" fill="#9fa896" />
    <polygon points="76,80 52,77 50,80 52,83" fill="#ffd166" />
    <circle cx="50" cy="80" r="3" fill="#ffd166" />

    <!-- Golden Coins Spilling -->
    <circle cx="95" cy="100" r="9" fill="url(#hh-gold-metal)" stroke="#997000" stroke-width="1" />
    <circle cx="108" cy="110" r="8" fill="url(#hh-gold-metal)" stroke="#997000" stroke-width="1" />
    <circle cx="90" cy="115" r="8" fill="url(#hh-gold-metal)" stroke="#997000" stroke-width="1" />
    <circle cx="102" cy="120" r="7" fill="url(#hh-gold-metal)" stroke="#997000" stroke-width="1" />
  </g>

  <!-- Mystery Forest Elements (Foliage & Mushrooms) -->
  <g transform="translate(180, 150)" opacity="0.85">
    <ellipse cx="25" cy="65" rx="14" ry="10" fill="#2d4a22" />
    <ellipse cx="45" cy="68" rx="16" ry="11" fill="#385e2b" />
    <!-- Glowing Forest Mushroom -->
    <path d="M 60,65 Q 67,46 76,65 Z" fill="#ff784f" filter="url(#hh-glow-lime)" />
    <rect x="66" y="65" width="4" height="12" rx="2" fill="#f4f2e9" />
    <circle cx="68" cy="56" r="1.5" fill="#ffffff" />
    <circle cx="73" cy="58" r="1.2" fill="#ffffff" />
  </g>

  <!-- Central Hero Element: Golden Magnifying Glass Revealing Mystery Key -->
  <g transform="translate(230, 115)">
    <!-- Discovered Mystical Golden Skeleton Key under lens -->
    <g transform="translate(-15, -18) rotate(-25)" filter="url(#hh-glow-gold)">
      <!-- Key Ring -->
      <circle cx="0" cy="0" r="14" fill="none" stroke="url(#hh-gold-metal)" stroke-width="3.5" />
      <circle cx="0" cy="0" r="7" fill="none" stroke="url(#hh-gold-metal)" stroke-width="2" />
      <polygon points="0,-14 -3,-9 3,-9" fill="url(#hh-gold-metal)" />
      <!-- Key Shaft -->
      <rect x="-2" y="14" width="4.5" height="36" rx="1.5" fill="url(#hh-gold-metal)" />
      <!-- Key Teeth -->
      <path d="M 2.5,38 H 12 V 43 H 2.5 Z M 2.5,45 H 9 V 50 H 2.5 Z" fill="url(#hh-gold-metal)" />
      <!-- Glowing Core Gem -->
      <circle cx="0" cy="0" r="3" fill="#d5ff55" filter="url(#hh-glow-lime)" />
    </g>

    <!-- Glass Lens Circular Viewport -->
    <circle cx="0" cy="0" r="54" fill="url(#hh-lens-grad)" stroke="url(#hh-gold-metal)" stroke-width="7" />
    <circle cx="0" cy="0" r="51" fill="none" stroke="#d5ff55" stroke-width="1.5" opacity="0.6" filter="url(#hh-glow-lime)" />
    <!-- Lens Specular Glare Arc -->
    <path d="M -36,-30 A 48 48 0 0 1 20,-44" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75" />

    <!-- Magnifying Glass Handle -->
    <g transform="rotate(45) translate(0, 54)">
      <!-- Brass Ferrule -->
      <rect x="-6" y="0" width="12" height="8" rx="1" fill="url(#hh-gold-metal)" stroke="#997000" stroke-width="1" />
      <!-- Dark Turned Wood Handle -->
      <path d="M -5,8 Q -7,35 -4,65 L 4,65 Q 7,35 5,8 Z" fill="#2b1a10" stroke="#4a2e1d" stroke-width="1.5" />
      <!-- Bottom Brass Cap -->
      <circle cx="0" cy="65" r="4.5" fill="url(#hh-gold-metal)" />
    </g>
  </g>

  <!-- Sparkles & Discovery Nodes -->
  <g fill="#d5ff55" filter="url(#hh-glow-lime)">
    <polygon points="175,65 178,72 185,75 178,78 175,85 172,78 165,75 172,72" />
    <polygon points="295,50 297,55 302,57 297,59 295,64 293,59 288,57 293,55" />
    <polygon points="275,185 277,189 281,191 277,193 275,197 273,193 269,191 273,189" />
  </g>

  <!-- Category & Game Badge Overlays -->
  <g transform="translate(24, 24)">
    <rect width="66" height="20" rx="4" fill="#1c201a" stroke="#2e352b" stroke-width="1" />
    <text x="33" y="14" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#d5ff55" text-anchor="middle" letter-spacing="1">PUZZLE</text>
  </g>

  <g transform="translate(98, 24)">
    <rect width="52" height="20" rx="4" fill="#ff784f" />
    <text x="26" y="14" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">NEW</text>
  </g>

  <!-- Title & Tagline Branding at Bottom -->
  <g transform="translate(240, 240)">
    <rect x="-135" y="-18" width="270" height="24" rx="12" fill="#0c0e0b" stroke="#2a3327" stroke-width="1.2" opacity="0.95" />
    <text x="0" y="-2" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" fill="#f4f2e9" text-anchor="middle" letter-spacing="1.5">
      HIDDEN HUNT <tspan fill="#d5ff55">//</tspan> <tspan font-size="10" font-weight="600" fill="#9fa896" letter-spacing="0.5">3 WORLDS · 15 SCENES</tspan>
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Circuit Connect Color Chain Logic Puzzle Game Thumbnail">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="ccBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="60%" stop-color="#090d15"/>
      <stop offset="100%" stop-color="#04060a"/>
    </radialGradient>

    <!-- Neon Glow Filters -->
    <filter id="glowCyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowRed" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowLime" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowGold" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="gridDots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Deep Stage Background -->
  <rect width="640" height="360" fill="url(#ccBg)"/>
  <rect width="640" height="360" fill="url(#gridDots)"/>

  <!-- Color Chain Flow Grid Board (Center Stage) -->
  <g transform="translate(180, 36)">
    <!-- Outer Card Frame -->
    <rect x="0" y="0" width="280" height="280" rx="16" fill="#0b101b" stroke="#1e293b" stroke-width="2.5"/>
    <rect x="5" y="5" width="270" height="270" rx="12" fill="#0d1422" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.2"/>

    <!-- Subtle Internal Grid Cells (5x5 Grid) -->
    <g stroke="#182335" stroke-width="1.2" opacity="0.8">
      <line x1="58" y1="5" x2="58" y2="275"/>
      <line x1="112" y1="5" x2="112" y2="275"/>
      <line x1="166" y1="5" x2="166" y2="275"/>
      <line x1="220" y1="5" x2="220" y2="275"/>
      <line x1="5" y1="58" x2="275" y2="58"/>
      <line x1="5" y1="112" x2="275" y2="112"/>
      <line x1="5" y1="166" x2="275" y2="166"/>
      <line x1="5" y1="220" x2="275" y2="220"/>
    </g>

    <!-- Wire 1: Coral Red Winding Path -->
    <path d="M 31 31 L 85 31 Q 139 31 139 85 L 139 139 Q 139 193 85 193 L 31 193"
          fill="none" stroke="#ff4757" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowRed)"/>
    <path d="M 31 31 L 85 31 Q 139 31 139 85 L 139 139 Q 139 193 85 193 L 31 193"
          fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Wire 2: Amber Gold Path (Outer Perimeter) -->
    <path d="M 193 31 L 247 31 Q 251 31 251 35 L 251 247 Q 251 251 247 251 L 139 251"
          fill="none" stroke="#ffd166" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowGold)"/>
    <path d="M 193 31 L 247 31 Q 251 31 251 35 L 251 247 Q 251 251 247 251 L 139 251"
          fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Wire 3: Lime Green Sinuous Path -->
    <path d="M 85 247 L 85 247 Q 31 247 31 247 L 31 247"
          fill="none" stroke="#d5ff55" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowLime)"/>
    <path d="M 31 247 L 85 247"
          fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Wire 4: Electric Cyan Main Path (Being Dragged!) -->
    <path d="M 31 139 Q 85 139 85 85 Q 85 31 139 31 L 139 31"
          fill="none" stroke="#38bdf8" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowCyan)"/>
    <path d="M 139 85 Q 193 85 193 139 L 193 193"
          fill="none" stroke="#38bdf8" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowCyan)"/>
    <path d="M 31 139 Q 85 139 85 85 Q 85 31 139 31"
          fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 139 85 Q 193 85 193 139 L 193 193"
          fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Red Endpoints -->
    <g transform="translate(31, 31)" filter="url(#glowRed)">
      <circle cx="0" cy="0" r="14" fill="#ff4757" stroke="#ffffff" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="#ffffff"/>
    </g>
    <g transform="translate(31, 193)" filter="url(#glowRed)">
      <circle cx="0" cy="0" r="14" fill="#ff4757" stroke="#ffffff" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="#ffffff"/>
    </g>

    <!-- Yellow Endpoints -->
    <g transform="translate(193, 31)" filter="url(#glowGold)">
      <circle cx="0" cy="0" r="14" fill="#ffd166" stroke="#ffffff" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="#ffffff"/>
    </g>
    <g transform="translate(139, 251)" filter="url(#glowGold)">
      <circle cx="0" cy="0" r="14" fill="#ffd166" stroke="#ffffff" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="#ffffff"/>
    </g>

    <!-- Lime Endpoints -->
    <g transform="translate(31, 247)" filter="url(#glowLime)">
      <circle cx="0" cy="0" r="14" fill="#d5ff55" stroke="#ffffff" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="#ffffff"/>
    </g>
    <g transform="translate(85, 247)" filter="url(#glowLime)">
      <circle cx="0" cy="0" r="14" fill="#d5ff55" stroke="#ffffff" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="#ffffff"/>
    </g>

    <!-- Cyan Endpoints & Touch Drag Tip -->
    <g transform="translate(31, 139)" filter="url(#glowCyan)">
      <circle cx="0" cy="0" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="#ffffff"/>
    </g>
    <g transform="translate(193, 193)" filter="url(#glowCyan)">
      <circle cx="0" cy="0" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="#ffffff"/>
      <!-- Glowing Target Flare -->
      <circle cx="0" cy="0" r="22" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
    </g>
  </g>

  <!-- Left Header Badges & Tagline -->
  <g transform="translate(24, 28)">
    <rect x="0" y="0" width="160" height="26" rx="6" fill="#171a16" stroke="#2d3329" stroke-width="1"/>
    <text x="10" y="17" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#38bdf8" letter-spacing="0.5">LOGIC // PUZZLE</text>
  </g>

  <g transform="translate(500, 28)">
    <rect x="0" y="0" width="116" height="26" rx="6" fill="#171a16" stroke="rgba(213, 255, 85, 0.4)" stroke-width="1"/>
    <text x="58" y="17" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#d5ff55" text-anchor="middle" letter-spacing="0.5">30 LEVELS</text>
  </g>

  <!-- Bottom Title Banner -->
  <g transform="translate(24, 334)">
    <text font-family="'Space Grotesk', -apple-system, sans-serif" font-size="20" font-weight="800" fill="#f3f4f6" letter-spacing="-0.5">
      CIRCUIT CONNECT <tspan fill="#38bdf8">//</tspan> <tspan font-size="13" font-family="'JetBrains Mono', monospace" font-weight="500" fill="#9ca3af">Color Chain Flow &amp; 100% Fill</tspan>
    </text>
  </g>
</svg>

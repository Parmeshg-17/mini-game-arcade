<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Dashverse Neon Rooftop Parkour Runner Game Thumbnail">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="dvBg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#141a2e"/>
      <stop offset="55%" stop-color="#0a0d18"/>
      <stop offset="100%" stop-color="#04060b"/>
    </radialGradient>

    <!-- Neon Glow Filters -->
    <filter id="glowCyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowLime" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowGold" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowPink" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="gridDots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1e293b" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Deep Stage Background -->
  <rect width="640" height="360" fill="url(#dvBg)"/>
  <rect width="640" height="360" fill="url(#gridDots)"/>

  <!-- Distant Megacity Skyscrapers -->
  <g opacity="0.75">
    <rect x="30" y="110" width="70" height="250" fill="#090d18"/>
    <rect x="85" y="60" width="85" height="300" fill="#0c1220"/>
    <rect x="155" y="140" width="60" height="220" fill="#080c16"/>
    <rect x="200" y="90" width="95" height="270" fill="#0e1526"/>
    <rect x="280" y="40" width="110" height="320" fill="#121b30"/>
    <rect x="375" y="100" width="80" height="260" fill="#0a0f1c"/>
    <rect x="440" y="70" width="90" height="290" fill="#0e1628"/>
    <rect x="515" y="130" width="75" height="230" fill="#090d19"/>

    <!-- Illuminated Windows -->
    <g fill="#38bdf8" opacity="0.3">
      <rect x="100" y="80" width="6" height="10"/>
      <rect x="115" y="80" width="6" height="10"/>
      <rect x="100" y="105" width="6" height="10"/>
      <rect x="130" y="105" width="6" height="10"/>
      <rect x="220" y="110" width="6" height="10"/>
      <rect x="240" y="110" width="6" height="10"/>
      <rect x="220" y="135" width="6" height="10"/>
      <rect x="255" y="135" width="6" height="10"/>
      <rect x="305" y="65" width="8" height="12"/>
      <rect x="330" y="65" width="8" height="12"/>
      <rect x="355" y="65" width="8" height="12"/>
      <rect x="305" y="95" width="8" height="12"/>
      <rect x="330" y="95" width="8" height="12"/>
      <rect x="460" y="90" width="6" height="10"/>
      <rect x="480" y="90" width="6" height="10"/>
      <rect x="460" y="120" width="6" height="10"/>
      <rect x="500" y="120" width="6" height="10"/>
    </g>
  </g>

  <!-- Giant Mid-Ground Neon Billboard -->
  <g transform="translate(290, 85)">
    <rect x="0" y="0" width="140" height="38" rx="4" fill="#0b101c" stroke="#c084fc" stroke-width="2" filter="url(#glowPink)"/>
    <text x="70" y="24" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">DASHVERSE</text>
  </g>

  <!-- Rooftop Terrain (Foreground) -->
  <g>
    <!-- Left Building Rooftop -->
    <rect x="0" y="260" width="220" height="100" fill="#141c2c" stroke="#25344d" stroke-width="1.5"/>
    <line x1="0" y1="260" x2="220" y2="260" stroke="#38bdf8" stroke-width="3" filter="url(#glowCyan)"/>

    <!-- Sky Chasm Gap between X=220 and X=290 -->

    <!-- Right Building Rooftop (Higher elevation) -->
    <rect x="290" y="240" width="350" height="120" fill="#121a28" stroke="#23324a" stroke-width="1.5"/>
    <line x1="290" y1="240" x2="640" y2="240" stroke="#38bdf8" stroke-width="3" filter="url(#glowCyan)"/>

    <!-- Rooftop AC Vent Hazard -->
    <rect x="460" y="212" width="40" height="28" rx="2" fill="#1e2638" stroke="#ff4757" stroke-width="2" filter="url(#glowPink)"/>
    <line x1="465" y1="220" x2="495" y2="220" stroke="#ff4757" stroke-width="2"/>
    <line x1="465" y1="228" x2="495" y2="228" stroke="#ff4757" stroke-width="2"/>

    <!-- Spring Pad Booster -->
    <rect x="160" y="250" width="44" height="10" rx="3" fill="#d5ff55" stroke="#ffffff" stroke-width="1" filter="url(#glowLime)"/>
    <polygon points="175,257 182,252 189,257" fill="#0b0f19"/>
  </g>

  <!-- Glowing Laser Security Barrier (Right side overhead) -->
  <g transform="translate(540, 175)">
    <rect x="0" y="0" width="6" height="65" fill="#222d42"/>
    <rect x="54" y="0" width="6" height="65" fill="#222d42"/>
    <!-- Laser Beam -->
    <line x1="3" y1="12" x2="57" y2="12" stroke="#38bdf8" stroke-width="4.5" filter="url(#glowCyan)"/>
    <line x1="3" y1="12" x2="57" y2="12" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Collectibles: Shard Arc & Cyber Package -->
  <!-- Data Shard Diamonds -->
  <g transform="translate(200, 160)" filter="url(#glowLime)">
    <polygon points="10,0 18,10 10,20 2,10" fill="#d5ff55"/>
    <circle cx="10" cy="10" r="3" fill="#ffffff"/>
  </g>
  <g transform="translate(245, 130)" filter="url(#glowLime)">
    <polygon points="10,0 18,10 10,20 2,10" fill="#d5ff55"/>
    <circle cx="10" cy="10" r="3" fill="#ffffff"/>
  </g>
  <g transform="translate(290, 135)" filter="url(#glowLime)">
    <polygon points="10,0 18,10 10,20 2,10" fill="#d5ff55"/>
    <circle cx="10" cy="10" r="3" fill="#ffffff"/>
  </g>

  <!-- Cyber Delivery Package -->
  <g transform="translate(340, 195)" filter="url(#glowGold)">
    <rect x="0" y="0" width="24" height="24" rx="2" fill="#ffd166"/>
    <rect x="9" y="0" width="6" height="24" fill="#ff784f"/>
    <rect x="0" y="9" width="24" height="6" fill="#ff784f"/>
  </g>

  <!-- Parkour Courier "Dash" Leaping Across The Chasm -->
  <g transform="translate(210, 150)">
    <!-- Speed Motion Trails -->
    <line x1="-35" y1="35" x2="-5" y2="35" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
    <line x1="-50" y1="20" x2="-10" y2="20" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>
    <line x1="-30" y1="50" x2="-5" y2="50" stroke="#d5ff55" stroke-width="1.5" opacity="0.7"/>

    <!-- Jet Sneaker Exhaust -->
    <ellipse cx="6" cy="62" rx="12" ry="5" fill="#38bdf8" filter="url(#glowCyan)"/>
    <circle cx="6" cy="62" r="3" fill="#ffffff"/>

    <!-- Legs & Running Tucked Vault -->
    <polygon points="12,42 28,32 38,48 24,54" fill="#1e293b"/>
    <polygon points="4,48 16,62 26,60 18,46" fill="#0f172a"/>
    <!-- Sneakers -->
    <rect x="22" y="52" width="14" height="6" rx="2" fill="#d5ff55" filter="url(#glowLime)"/>
    <rect x="12" y="60" width="14" height="6" rx="2" fill="#38bdf8" filter="url(#glowCyan)"/>

    <!-- Cyber Jacket Body (Cyan with Lime Accent) -->
    <polygon points="16,16 38,10 44,38 20,44" fill="#38bdf8" filter="url(#glowCyan)"/>
    <polygon points="26,12 36,10 38,36 28,38" fill="#d5ff55"/>

    <!-- Arm Vaulting Forward -->
    <polygon points="34,18 52,10 56,16 38,24" fill="#1e293b"/>
    <circle cx="55" cy="13" r="4" fill="#d5ff55"/>

    <!-- Cyber Helmet & Glowing Neon Visor -->
    <circle cx="32" cy="6" r="13" fill="#0f172a"/>
    <rect x="34" y="2" width="12" height="6" rx="2" fill="#38bdf8" filter="url(#glowCyan)"/>
    <rect x="36" y="4" width="8" height="2" fill="#ffffff"/>
  </g>

  <!-- Top Badges -->
  <g transform="translate(24, 28)">
    <rect x="0" y="0" width="170" height="26" rx="6" fill="#171a16" stroke="#2d3329" stroke-width="1"/>
    <text x="12" y="17" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="0.5">ACTION // PARKOUR</text>
  </g>

  <g transform="translate(480, 28)">
    <rect x="0" y="0" width="136" height="26" rx="6" fill="#171a16" stroke="rgba(213, 255, 85, 0.4)" stroke-width="1"/>
    <text x="68" y="17" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#d5ff55" text-anchor="middle" letter-spacing="0.5">ENDLESS RUNNER</text>
  </g>

  <!-- Bottom Title Banner -->
  <g transform="translate(24, 334)">
    <text font-family="'Space Grotesk', -apple-system, sans-serif" font-size="20" font-weight="800" fill="#f3f4f6" letter-spacing="-0.5">
      DASHVERSE <tspan fill="#38bdf8">//</tspan> <tspan font-size="13" font-family="'JetBrains Mono', monospace" font-weight="500" fill="#9ca3af">Neon Rooftop Parkour Rush</tspan>
    </text>
  </g>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Block Puzzle Arcade Game Thumbnail">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bpBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0e0b"/>
      <stop offset="50%" stop-color="#141812"/>
      <stop offset="100%" stop-color="#1a2016"/>
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="bpGlowLime" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bpGlowCyan" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bpGlowGold" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bpBlastGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Dot Pattern -->
    <pattern id="bpDotGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#242c20" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Deep Stage Background -->
  <rect width="640" height="360" fill="url(#bpBg)"/>
  <rect width="640" height="360" fill="url(#bpDotGrid)"/>

  <!-- Radial Atmosphere Lighting -->
  <circle cx="320" cy="160" r="150" fill="#d5ff55" opacity="0.05" filter="url(#bpGlowLime)"/>
  <circle cx="240" cy="180" r="120" fill="#38bdf8" opacity="0.05" filter="url(#bpGlowCyan)"/>

  <!-- Main 8x8 Board Stage Container -->
  <g transform="translate(200, 32)">
    <!-- Board Frame & Shadow -->
    <rect x="-10" y="-10" width="260" height="260" rx="16" fill="#0d0f0c" stroke="#2a3325" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="240" rx="8" fill="#141712"/>

    <!-- 8x8 Subtle Grid Cells (Cell size = 27px, Gap = 3px) -->
    <!-- We render empty cells across 8 rows -->
    <!-- Row 0 -->
    <g fill="#1b2018" stroke="rgba(255,255,255,0.03)" stroke-width="1">
      <rect x="3" y="3" width="27" height="27" rx="3"/>
      <rect x="33" y="3" width="27" height="27" rx="3"/>
      <rect x="63" y="3" width="27" height="27" rx="3"/>
      <rect x="93" y="3" width="27" height="27" rx="3"/>
      <rect x="123" y="3" width="27" height="27" rx="3"/>
      <rect x="153" y="3" width="27" height="27" rx="3"/>
      <rect x="183" y="3" width="27" height="27" rx="3"/>
      <rect x="213" y="3" width="27" height="27" rx="3"/>

      <!-- Row 1 -->
      <rect x="3" y="33" width="27" height="27" rx="3"/>
      <rect x="33" y="33" width="27" height="27" rx="3"/>
      <rect x="63" y="33" width="27" height="27" rx="3"/>
      <rect x="93" y="33" width="27" height="27" rx="3"/>
      <rect x="123" y="33" width="27" height="27" rx="3"/>
      <rect x="153" y="33" width="27" height="27" rx="3"/>
      <rect x="183" y="33" width="27" height="27" rx="3"/>
      <rect x="213" y="33" width="27" height="27" rx="3"/>

      <!-- Row 2 -->
      <rect x="3" y="63" width="27" height="27" rx="3"/>
      <rect x="33" y="63" width="27" height="27" rx="3"/>
      <rect x="63" y="63" width="27" height="27" rx="3"/>
      <rect x="93" y="63" width="27" height="27" rx="3"/>
      <rect x="123" y="63" width="27" height="27" rx="3"/>
      <rect x="153" y="63" width="27" height="27" rx="3"/>
      <rect x="183" y="63" width="27" height="27" rx="3"/>
      <rect x="213" y="63" width="27" height="27" rx="3"/>

      <!-- Row 3 -->
      <rect x="3" y="93" width="27" height="27" rx="3"/>
      <rect x="33" y="93" width="27" height="27" rx="3"/>
      <rect x="63" y="93" width="27" height="27" rx="3"/>
      <rect x="93" y="93" width="27" height="27" rx="3"/>
      <rect x="123" y="93" width="27" height="27" rx="3"/>
      <rect x="153" y="93" width="27" height="27" rx="3"/>
      <rect x="183" y="93" width="27" height="27" rx="3"/>
      <rect x="213" y="93" width="27" height="27" rx="3"/>

      <!-- Row 4 -->
      <rect x="3" y="123" width="27" height="27" rx="3"/>
      <rect x="33" y="123" width="27" height="27" rx="3"/>
      <rect x="63" y="123" width="27" height="27" rx="3"/>
      <rect x="93" y="123" width="27" height="27" rx="3"/>
      <rect x="123" y="123" width="27" height="27" rx="3"/>
      <rect x="153" y="123" width="27" height="27" rx="3"/>
      <rect x="183" y="123" width="27" height="27" rx="3"/>
      <rect x="213" y="123" width="27" height="27" rx="3"/>

      <!-- Row 5 -->
      <rect x="3" y="153" width="27" height="27" rx="3"/>
      <rect x="33" y="153" width="27" height="27" rx="3"/>
      <rect x="63" y="153" width="27" height="27" rx="3"/>
      <rect x="93" y="153" width="27" height="27" rx="3"/>
      <rect x="123" y="153" width="27" height="27" rx="3"/>
      <rect x="153" y="153" width="27" height="27" rx="3"/>
      <rect x="183" y="153" width="27" height="27" rx="3"/>
      <rect x="213" y="153" width="27" height="27" rx="3"/>

      <!-- Row 6 -->
      <rect x="3" y="183" width="27" height="27" rx="3"/>
      <rect x="33" y="183" width="27" height="27" rx="3"/>
      <rect x="63" y="183" width="27" height="27" rx="3"/>
      <rect x="93" y="183" width="27" height="27" rx="3"/>
      <rect x="123" y="183" width="27" height="27" rx="3"/>
      <rect x="153" y="183" width="27" height="27" rx="3"/>
      <rect x="183" y="183" width="27" height="27" rx="3"/>
      <rect x="213" y="183" width="27" height="27" rx="3"/>

      <!-- Row 7 -->
      <rect x="3" y="213" width="27" height="27" rx="3"/>
      <rect x="33" y="213" width="27" height="27" rx="3"/>
      <rect x="63" y="213" width="27" height="27" rx="3"/>
      <rect x="93" y="213" width="27" height="27" rx="3"/>
      <rect x="123" y="213" width="27" height="27" rx="3"/>
      <rect x="153" y="213" width="27" height="27" rx="3"/>
      <rect x="183" y="213" width="27" height="27" rx="3"/>
      <rect x="213" y="213" width="27" height="27" rx="3"/>
    </g>

    <!-- Placed Blocks on Board -->
    <!-- Gold 2x2 Square at (0, 0) -->
    <g fill="#ffd166" stroke="#fff" stroke-width="1" filter="url(#bpGlowGold)">
      <rect x="3" y="3" width="27" height="27" rx="4"/>
      <rect x="33" y="3" width="27" height="27" rx="4"/>
      <rect x="3" y="33" width="27" height="27" rx="4"/>
      <rect x="33" y="33" width="27" height="27" rx="4"/>
    </g>

    <!-- Cyan 1x3 Line at (0, 4) -->
    <g fill="#38bdf8" stroke="#fff" stroke-width="1" filter="url(#bpGlowCyan)">
      <rect x="123" y="3" width="27" height="27" rx="4"/>
      <rect x="153" y="3" width="27" height="27" rx="4"/>
      <rect x="183" y="3" width="27" height="27" rx="4"/>
    </g>

    <!-- Purple Corner Piece at (5, 0) -->
    <g fill="#c084fc" stroke="#fff" stroke-width="1">
      <rect x="3" y="153" width="27" height="27" rx="4"/>
      <rect x="33" y="153" width="27" height="27" rx="4"/>
      <rect x="3" y="183" width="27" height="27" rx="4"/>
    </g>

    <!-- Lime Green Blast Row (Row 4 is exploding!) -->
    <g fill="#d5ff55" stroke="#ffffff" stroke-width="1.5" filter="url(#bpBlastGlow)">
      <rect x="3" y="123" width="27" height="27" rx="4"/>
      <rect x="33" y="123" width="27" height="27" rx="4"/>
      <rect x="63" y="123" width="27" height="27" rx="4"/>
      <rect x="93" y="123" width="27" height="27" rx="4"/>
      <rect x="123" y="123" width="27" height="27" rx="4"/>
      <rect x="153" y="123" width="27" height="27" rx="4"/>
      <rect x="183" y="123" width="27" height="27" rx="4"/>
      <rect x="213" y="123" width="27" height="27" rx="4"/>
    </g>

    <!-- Laser Line Blast Beam across Row 4 -->
    <line x1="-15" y1="136" x2="255" y2="136" stroke="#ffffff" stroke-width="4" filter="url(#bpBlastGlow)"/>
    <line x1="-5" y1="136" x2="245" y2="136" stroke="#d5ff55" stroke-width="2"/>

    <!-- Exploding Spark Particles around blast row -->
    <circle cx="48" cy="115" r="3" fill="#ffffff"/>
    <circle cx="108" cy="155" r="3.5" fill="#d5ff55"/>
    <circle cx="168" cy="118" r="4" fill="#ffd166"/>
    <circle cx="218" cy="150" r="3" fill="#38bdf8"/>
    <line x1="80" y1="120" x2="70" y2="105" stroke="#d5ff55" stroke-width="2" stroke-linecap="round"/>
    <line x1="140" y1="145" x2="148" y2="160" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

    <!-- Red / Rose Corner at (6, 5) -->
    <g fill="#fb7185" stroke="#fff" stroke-width="1">
      <rect x="153" y="183" width="27" height="27" rx="4"/>
      <rect x="183" y="183" width="27" height="27" rx="4"/>
      <rect x="213" y="183" width="27" height="27" rx="4"/>
      <rect x="213" y="213" width="27" height="27" rx="4"/>
    </g>
  </g>

  <!-- Bottom Dock Tray with 3 Shapes -->
  <g transform="translate(200, 290)">
    <!-- Slot 1 (Selected with Lime Glow) -->
    <rect x="-10" y="0" width="76" height="56" rx="10" fill="#1b2218" stroke="#d5ff55" stroke-width="2" filter="url(#bpGlowLime)"/>
    <!-- Mini 2x2 Box in Slot 1 -->
    <g fill="#ffd166" transform="translate(18, 14)">
      <rect x="0" y="0" width="11" height="11" rx="2"/>
      <rect x="13" y="0" width="11" height="11" rx="2"/>
      <rect x="0" y="13" width="11" height="11" rx="2"/>
      <rect x="13" y="13" width="11" height="11" rx="2"/>
    </g>

    <!-- Slot 2 -->
    <rect x="82" y="0" width="76" height="56" rx="10" fill="#171b15" stroke="#323b2c" stroke-width="1.5"/>
    <!-- Mini 1x3 Bar in Slot 2 -->
    <g fill="#38bdf8" transform="translate(101, 22)">
      <rect x="0" y="0" width="11" height="11" rx="2"/>
      <rect x="13" y="0" width="11" height="11" rx="2"/>
      <rect x="26" y="0" width="11" height="11" rx="2"/>
    </g>

    <!-- Slot 3 -->
    <rect x="174" y="0" width="76" height="56" rx="10" fill="#171b15" stroke="#323b2c" stroke-width="1.5"/>
    <!-- Mini Corner Shape in Slot 3 -->
    <g fill="#c084fc" transform="translate(202, 16)">
      <rect x="0" y="0" width="11" height="11" rx="2"/>
      <rect x="13" y="0" width="11" height="11" rx="2"/>
      <rect x="0" y="13" width="11" height="11" rx="2"/>
    </g>
  </g>

  <!-- Left Side Badges & Stats HUD -->
  <g transform="translate(32, 70)">
    <!-- Eyebrow Badge -->
    <rect x="0" y="0" width="132" height="26" rx="6" fill="#192215" stroke="#d5ff55" stroke-width="1"/>
    <text x="66" y="17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#d5ff55" text-anchor="middle">PUZZLE ARENA</text>

    <!-- Big Score Display -->
    <text x="0" y="68" font-family="'Space Grotesk', sans-serif" font-size="34" font-weight="800" fill="#ffffff">5,840</text>
    <text x="0" y="90" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#d5ff55">HIGH SCORE</text>

    <!-- Lines Cleared Counter -->
    <rect x="0" y="112" width="138" height="38" rx="8" fill="#171a15" stroke="#2c3527" stroke-width="1.5"/>
    <text x="14" y="136" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#889680">LINES:</text>
    <text x="124" y="136" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="bold" fill="#38bdf8" text-anchor="end">14</text>
  </g>

  <!-- Right Side Badges & Combo Indicator -->
  <g transform="translate(470, 70)">
    <!-- Combo Multiplier Pill -->
    <rect x="0" y="0" width="138" height="36" rx="8" fill="#2d3f18" stroke="#d5ff55" stroke-width="1.5" filter="url(#bpGlowLime)"/>
    <text x="69" y="23" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800" fill="#d5ff55" text-anchor="middle">⚡ 3x COMBO</text>

    <!-- Blast Notice -->
    <rect x="0" y="52" width="138" height="42" rx="8" fill="#182736" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="14" y="77" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#78a8c4">BLAST:</text>
    <text x="124" y="78" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold" fill="#ffd166" text-anchor="end">+600 PTS</text>

    <!-- Moves Counter -->
    <rect x="0" y="108" width="138" height="36" rx="8" fill="#171a15" stroke="#2c3527" stroke-width="1.5"/>
    <text x="14" y="131" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#889680">MOVES:</text>
    <text x="124" y="131" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="end">28</text>
  </g>

  <!-- Bottom Title Tag -->
  <g transform="translate(320, 350)">
    <rect x="-140" y="-12" width="280" height="24" rx="6" fill="#10120f" stroke="#252d21" stroke-width="1"/>
    <text x="0" y="5" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#8ca085" text-anchor="middle" letter-spacing="0.08em">BLOCK PUZZLE // 8×8 GRID</text>
  </g>
</svg>

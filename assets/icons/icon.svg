<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171A16"/>
      <stop offset="100%" stop-color="#0E100D"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2FF7A"/>
      <stop offset="100%" stop-color="#D5FF55"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(213,255,85,0.25)" stroke-width="6"/>

  <!-- Geometric Arcade Cross / D-Pad & Core -->
  <g filter="url(#neonGlow)">
    <!-- Horizontal Cross Bar -->
    <rect x="96" y="224" width="320" height="64" rx="16" fill="#20241E" stroke="#D5FF55" stroke-width="4"/>
    <!-- Vertical Cross Bar -->
    <rect x="224" y="96" width="64" height="320" rx="16" fill="#20241E" stroke="#D5FF55" stroke-width="4"/>

    <!-- Central Glowing Core -->
    <rect x="208" y="208" width="96" height="96" rx="20" fill="url(#limeGrad)"/>
    <circle cx="256" cy="256" r="24" fill="#10120F"/>

    <!-- Accent Dots / Action Buttons -->
    <circle cx="144" cy="256" r="14" fill="#D5FF55"/>
    <circle cx="368" cy="256" r="14" fill="#D5FF55"/>
    <circle cx="256" cy="144" r="14" fill="#D5FF55"/>
    <circle cx="256" cy="368" r="14" fill="#D5FF55"/>

    <!-- Neon Top-Right Badge Spark -->
    <circle cx="384" cy="128" r="28" fill="#FF784F"/>
    <path d="M384 112V144M368 128H400" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>